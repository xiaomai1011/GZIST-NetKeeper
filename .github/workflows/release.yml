name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # All versions share mutable update manifests; never deploy tags concurrently.
  group: release-publication
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mygo.json version
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mygo.json version $want"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Require update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is required for a release"
            exit 1
          fi
      - name: Require R2 publication configuration
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for name in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::missing $name"
              exit 1
            fi
          done
          test "$(jq -r '.updates.url' mygo.json)" = "https://dl2.nerv-base.com"
      - name: Require a newer stable version than the public feed
        env:
          CGO_ENABLED: "0"
        run: |
          go run ./tools/feedcheck -mode upgrade \
            -base-url "$(jq -r '.updates.url' mygo.json)" \
            -version "$(jq -r '.version' mygo.json)"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            if [ "$(jq -r '.isDraft' <<< "$existing")" != true ]; then
              echo "::error::refusing to modify an already-published release; increase the version"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "GZIST NetKeeper $GITHUB_REF_NAME" --generate-notes
          fi
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi

  build:
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/arm64,darwin/amd64
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      - name: Require manifests for every target
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            target="${platform/\//-}"
            test -s "build/$target/update-$target.json" || {
              echo "::error::missing signed update manifest for $target"
              exit 1
            }
          done
      # mygo build names the installers of every architecture the same
      # ("GZIST NetKeeper 2.0.0.dmg", "GZIST NetKeeper Setup 2.0.0.exe"), so
      # -upload would overwrite one with the other. Give them arch-specific
      # names and upload like -upload does: files first, manifests last.
      - name: Rename installers and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(jq -r .version mygo.json)"
          files=(); manifests=()
          for dir in build/*/; do
            target="$(basename "$dir")"            # e.g. darwin-arm64
            os="${target%-*}"; arch="${target#*-}"
            [ "$arch" = amd64 ] && arch=x64
            for f in "$dir"*.dmg; do
              n="${dir}GZIST-NetKeeper-${version}-macos-${arch}.dmg"; mv "$f" "$n"; files+=("$n")
            done
            for f in "$dir"*" Setup "*.exe; do
              n="${dir}GZIST-NetKeeper-${version}-windows-${arch}-setup.exe"; mv "$f" "$n"; files+=("$n")
            done
            for f in "$dir"*.deb "$dir"*.tar.gz "$dir"*.delta; do files+=("$f"); done
            if [ -f "${dir}install.sh" ] && [[ " ${files[*]} " != *"install.sh"* ]]; then files+=("${dir}install.sh"); fi
            for f in "$dir"update-*.json; do manifests+=("$f"); done
          done
          printf 'file: %s\n' "${files[@]}" "${manifests[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${manifests[@]}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download and verify complete release
        env:
          GH_TOKEN: ${{ github.token }}
          CGO_ENABLED: "0"
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          base="$(jq -r '.updates.url // empty' mygo.json)"
          if [ -z "$base" ]; then
            base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          fi
          go run ./tools/releasefeed -assets release-assets -out release-feed -base-url "$base"
      - name: Upload checksum list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hash the original GitHub assets, not the rewritten staging manifests.
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum) > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS
      - name: Save static feed for trusted hosting
        uses: actions/upload-artifact@v4
        with:
          name: release-feed-${{ github.ref_name }}
          path: release-feed/
          retention-days: 14
      - name: Recheck stable publication order
        env:
          CGO_ENABLED: "0"
        run: |
          go run ./tools/feedcheck -mode upgrade \
            -base-url "$(jq -r '.updates.url' mygo.json)" \
            -version "$(jq -r '.version' mygo.json)"
      - name: Publish immutable payloads to R2
        timeout-minutes: 35
        env:
          CGO_ENABLED: "0"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: go run ./tools/r2publish -dir release-feed -payloads-only
      - name: Verify public payloads before exposing manifests
        timeout-minutes: 12
        env:
          CGO_ENABLED: "0"
        run: go run ./tools/feedcheck -dir release-feed -base-url "$(jq -r '.updates.url' mygo.json)" -payloads-only
      - name: Publish verified feed controls to R2
        timeout-minutes: 35
        env:
          CGO_ENABLED: "0"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: go run ./tools/r2publish -dir release-feed
      - name: Verify public EdgeOne delivery
        timeout-minutes: 12
        env:
          CGO_ENABLED: "0"
        run: go run ./tools/feedcheck -dir release-feed -base-url "$(jq -r '.updates.url' mygo.json)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
